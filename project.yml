name: Shelf
options:
  bundleIdPrefix: com.lazylab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ShelfKit:
    path: ShelfKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

targets:
  Shelf:
    type: application
    platform: iOS
    sources:
      - Shelf
    dependencies:
      - package: ShelfKit
      - package: MarkdownUI
        product: MarkdownUI
      - target: ShareExtension
        embed: true
    info:
      path: Shelf/Info.plist
      properties:
        CFBundleDisplayName: Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Literata-Variable.ttf
          - Literata-Italic-Variable.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazylab.shelf
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Shelf/Resources/Shelf.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # Shared with the app target: tokens/type + storage location helper.
      - Shelf/DesignSystem
      - path: Shelf/App/ShelfEnvironment.swift
      - path: Shelf/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: ShelfKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Literata-Variable.ttf
          - Literata-Italic-Variable.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazylab.shelf.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
